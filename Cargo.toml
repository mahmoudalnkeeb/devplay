[package]
name = "devplay"
version = "1.0.0"
edition = "2021"
description = "Tiny Windows tray app that switches your PC between Dev Mode and Play Mode"
authors = ["Mahmoud Alnakeeb"]
license = "MIT"
repository = "https://github.com/mahmoudalnkeeb/devplay"
readme = "README.md"
keywords = ["windows", "tray", "gaming", "docker", "wsl"]
categories = ["command-line-utilities"]

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
